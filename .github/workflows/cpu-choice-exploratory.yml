name: CPU finite-choice model action pilot

on:
  pull_request:
    paths:
      - cpu_choice_pilot.py
      - test_cpu_choice_pilot.py
      - .github/workflows/cpu-choice-exploratory.yml
  workflow_dispatch:

jobs:
  cpu-real-model-decision:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bounded action adapter
        run: |
          python -m unittest -v test_cpu_choice_pilot
          python -m py_compile cpu_choice_pilot.py
      - name: Install pinned inference dependencies
        run: |
          python -m pip install 'numpy<2' 'transformers==4.46.3' 'huggingface_hub==0.26.5'
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Execute pinned real-model finite-choice experiment
        run: python cpu_choice_pilot.py --out cpu-choice-results
      - name: Preserve source commit and resolved dependencies
        if: always()
        run: |
          mkdir -p cpu-choice-results
          git rev-parse HEAD > cpu-choice-results/commit.txt
          python -m pip freeze > cpu-choice-results/pip-freeze.txt
      - name: Archive completed and partial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kloop-cpu-choice-real-model
          path: cpu-choice-results/
          if-no-files-found: warn
