name: CPU finite-choice model action pilot

on:
  workflow_dispatch:

jobs:
  cpu-real-model-decision:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate finite-choice and counterbalance code
        run: |
          python -m unittest -v test_cpu_choice_pilot test_cpu_choice_permutation
          python -m py_compile cpu_choice_permutation.py
      - name: Install pinned inference dependencies
        run: |
          python -m pip install 'numpy<2' 'transformers==4.46.3' 'huggingface_hub==0.26.5'
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Execute five rotated model prompts (not a four-arm repeat)
        run: python cpu_choice_permutation.py --out cpu-choice-rotation
      - name: Preserve source commit and resolved dependencies
        if: always()
        run: |
          mkdir -p cpu-choice-rotation
          git rev-parse HEAD > cpu-choice-rotation/commit.txt
          python -m pip freeze > cpu-choice-rotation/pip-freeze.txt
      - name: Archive completed and partial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kloop-cpu-choice-label-rotation
          path: cpu-choice-rotation/
          if-no-files-found: warn
