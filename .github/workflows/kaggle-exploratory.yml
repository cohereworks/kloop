name: Kaggle exploratory benchmark

on:
  workflow_dispatch:
    inputs:
      model_slug:
        description: 'Model slug from kaggle benchmarks tasks models'
        required: false
        type: string
      execute:
        description: 'Push task and run selected model (otherwise readiness check only)'
        required: true
        type: boolean
        default: false

jobs:
  kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KLOOP_MODEL_SLUG: ${{ inputs.model_slug }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify credential injection and model slug
        shell: bash
        run: |
          if [ -z "${KAGGLE_API_TOKEN:-}" ]; then
            echo 'Missing KAGGLE_API_TOKEN repository secret' >&2
            exit 2
          fi
          if [[ "${{ inputs.execute }}" == 'true' && ! "$KLOOP_MODEL_SLUG" =~ ^[a-zA-Z0-9][a-zA-Z0-9._/@-]*$ ]]; then
            echo 'Invalid model slug characters' >&2
            exit 2
          fi
      - name: Install official Kaggle CLI
        run: python -m pip install kaggle
      - name: Build and compile standalone task
        run: |
          python -m unittest -v test_pilot test_api_agent test_kaggle_task test_analyze_trial test_holdout_commitment test_private_trial test_discovery_pilot test_discovery_api_agent test_preference_pilot test_preference_api_agent test_preference_private_trial test_provider_isolation_audit
          python build_kaggle_task.py
          python -m py_compile dist/kloop_kaggle_benchmark.py
      - name: Inspect available inference quota
        run: kaggle benchmarks quota
      - name: Push exploratory task
        if: ${{ inputs.execute }}
        run: kaggle benchmarks tasks push kloop-pilot -f dist/kloop_kaggle_benchmark.py --wait 1800
      - name: Run selected model
        if: ${{ inputs.execute }}
        run: kaggle benchmarks tasks run kloop-pilot -m "$KLOOP_MODEL_SLUG" --wait 3600
      - name: Download run outputs
        if: ${{ inputs.execute }}
        run: kaggle benchmarks tasks download kloop-pilot -m "$KLOOP_MODEL_SLUG" -o kaggle-results
      - name: Archive run outputs
        if: ${{ inputs.execute && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: kloop-kaggle-exploratory
          path: kaggle-results/
          if-no-files-found: warn
