name: CPU open-weight exploratory smoke pilot

# Hosted model inference consumes runner minutes and is never dispatched by
# ordinary PR synchronization, pushes, or CI. Only explicit operator dispatch.
on:
  workflow_dispatch:

jobs:
  real-model-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify CPU runner and Qwen wrapper without model download
        run: |
          python -m unittest -v test_cpu_openweight_pilot
          python -m py_compile cpu_openweight_qwen_pilot.py
      - name: Install pinned CPU inference stack
        run: |
          python -m pip install 'numpy<2' 'transformers==4.46.3' 'huggingface_hub==0.26.5'
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Run second independent Qwen protocol-adequacy check
        run: python cpu_openweight_qwen_pilot.py
      - name: Preserve runtime versions and commit, even if inference fails
        if: always()
        run: |
          mkdir -p cpu-pilot-qwen-results
          python -m pip freeze > cpu-pilot-qwen-results/pip-freeze.txt
          git rev-parse HEAD > cpu-pilot-qwen-results/commit.txt
      - name: Archive all evidence, even on incomplete model execution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kloop-cpu-qwen-protocol-adequacy
          path: cpu-pilot-qwen-results/
          if-no-files-found: warn
