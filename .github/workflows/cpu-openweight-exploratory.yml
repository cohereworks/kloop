name: CPU open-weight exploratory smoke pilot

on:
  push:
    branches: [research/cpu-openweight-pilot]
    paths:
      - cpu_openweight_pilot.py
      - test_cpu_openweight_pilot.py
      - .github/workflows/cpu-openweight-exploratory.yml
  pull_request:
    paths:
      - cpu_openweight_pilot.py
      - test_cpu_openweight_pilot.py
      - .github/workflows/cpu-openweight-exploratory.yml
  workflow_dispatch:

jobs:
  real-model-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify new runner without model download
        run: python -m unittest -v test_cpu_openweight_pilot
      - name: Install pinned CPU inference stack
        run: |
          python -m pip install 'numpy<2' 'transformers==4.46.3' 'huggingface_hub==0.26.5'
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Run one task across four arms with real model
        run: |
          python cpu_openweight_pilot.py --out cpu-pilot-results --count 1 --max-turns 2 --token-cap 12000
      - name: Preserve runtime versions and commit, even if inference fails
        if: always()
        run: |
          mkdir -p cpu-pilot-results
          python -m pip freeze > cpu-pilot-results/pip-freeze.txt
          git rev-parse HEAD > cpu-pilot-results/commit.txt
      - name: Archive all evidence, even on incomplete model execution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kloop-cpu-openweight-exploratory
          path: cpu-pilot-results/
          if-no-files-found: warn
